name: Release

# Builds terraLaunch for Windows, macOS and Linux. A pushed tag `v<version>` (matching the
# version in Cargo.toml) also publishes a GitHub Release with the files and their checksums.
# Run it by hand (workflow_dispatch) to get the builds as workflow artifacts without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-15
          - name: linux
            os: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      # ---- Windows: a per-user MSI installer (Start menu and desktop shortcuts, uninstall from
      # Apps & features). Built with WiX v5 by packaging/windows/build-msi.ps1.
      - name: Build (Windows)
        if: matrix.name == 'windows'
        env:
          TERRALAUNCHER_REQUIRE_WINRES: "1"
        run: cargo build --release --locked -p artcraft-launcher

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          ./packaging/windows/build-msi.ps1 -OutDir dist

      # ---- macOS: a universal app in a disk image, signed with the owner's Developer ID and
      # notarized when the six APPLE_* secrets are set (the same ones terraGen's release uses).
      # With none set it builds with an ad-hoc signature and says so in a warning; with only some
      # set the job fails.
      - name: Build (macOS)
        if: matrix.name == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p artcraft-launcher --target aarch64-apple-darwin
          cargo build --release --locked -p artcraft-launcher --target x86_64-apple-darwin

      - name: Package, sign and notarize (macOS)
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          given=0
          for name in $names; do if [ -n "${!name}" ]; then given=$((given + 1)); fi; done
          if [ "$given" -eq 0 ]; then
            echo "::warning::no Apple secret is set: the macOS app is built UNSIGNED (ad-hoc signature only)"
            signed=0
          elif [ "$given" -ne 6 ]; then
            for name in $names; do
              if [ -z "${!name}" ]; then echo "::error::the secret $name is not set"; fi
            done
            exit 1
          else
            signed=1
          fi
          echo "MAC_SIGNED=$signed" >> "$GITHUB_ENV"

          app="dist/dmg/terraLaunch.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/terraLaunch" \
            target/aarch64-apple-darwin/release/terralauncher target/x86_64-apple-darwin/release/terralauncher
          sed "s/__VERSION__/$VERSION/g" packaging/macos/terralauncher-Info.plist > "$app/Contents/Info.plist"
          # The icon, from the PNG renders.
          icons="assets/app-icon/hicolor"; id="xyz.terrapen.terralauncher"; set="$RUNNER_TEMP/terralauncher.iconset"
          mkdir -p "$set"
          cp "$icons/16x16/apps/$id.png" "$set/icon_16x16.png"
          cp "$icons/32x32/apps/$id.png" "$set/icon_16x16@2x.png"
          cp "$icons/32x32/apps/$id.png" "$set/icon_32x32.png"
          cp "$icons/64x64/apps/$id.png" "$set/icon_32x32@2x.png"
          cp "$icons/128x128/apps/$id.png" "$set/icon_128x128.png"
          cp "$icons/256x256/apps/$id.png" "$set/icon_128x128@2x.png"
          cp "$icons/256x256/apps/$id.png" "$set/icon_256x256.png"
          cp "$icons/512x512/apps/$id.png" "$set/icon_256x256@2x.png"
          cp "$icons/512x512/apps/$id.png" "$set/icon_512x512.png"
          cp assets/app-icon/terralauncher-1024.png "$set/icon_512x512@2x.png"
          iconutil -c icns "$set" -o "$app/Contents/Resources/terralauncher.icns"
          dmg="dist/terralauncher-$VERSION-macos-universal.dmg"
          if [ "$signed" -eq 1 ]; then
            # The certificate goes into a throwaway keychain that only this job uses.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password=$(openssl rand -hex 24)
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/certificate.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            # Apple's Developer ID intermediate: without it in reach the identity isn't valid and
            # codesign finds none. It may be there already, so a failed import is fine.
            curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
            # Sign with the one valid Developer ID Application identity this keychain holds, by its
            # hash, and take the team from its name ("… (TEAMID)"): names and IDs typed into secrets
            # can be off, the certificate can't.
            line=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -n1 || true)
            identity=$(printf '%s' "$line" | awk '{print $2}')
            team=$(printf '%s' "$line" | sed -nE 's/.*\(([A-Z0-9]{10})\)"$/\1/p')
            if [ -z "$identity" ] || [ -z "$team" ]; then
              echo "::error::the certificate in APPLE_CERTIFICATE gives no valid Developer ID Application identity"
              security find-identity -p codesigning "$keychain"
              exit 1
            fi
            if [ "$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')" != "$team" ]; then
              echo "::warning::APPLE_TEAM_ID is not the certificate's team ($team); notarizing with the certificate's"
            fi
            # The hardened runtime and a secure timestamp, as notarization requires. The app is one
            # executable with no nested code and needs no entitlements.
            codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" "$app"
          else
            # An ad-hoc signature: Apple silicon runs nothing unsigned. It is not a Developer ID.
            codesign --force --deep --sign - "$app"
          fi
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "terraLaunch" -srcfolder dist/dmg -ov -format UDZO "$dmg"
          rm -rf dist/dmg
          if [ "$signed" -eq 1 ]; then
            codesign --force --timestamp --keychain "$keychain" --sign "$identity" "$dmg"
            # Apple checks the disk image and the app in it; the ticket is stapled to the image so
            # it opens without a network check.
            apple_id=$(printf '%s' "$APPLE_ID" | tr -d '[:space:]')
            app_password=$(printf '%s' "$APPLE_PASSWORD" | tr -d '[:space:]')
            xcrun notarytool submit "$dmg" --apple-id "$apple_id" --password "$app_password" --team-id "$team" --wait --timeout 30m
            xcrun stapler staple "$dmg"
            security delete-keychain "$keychain"
          fi

      # The disk image a user downloads, and the app inside it, as Gatekeeper will judge them.
      - name: The macOS app is signed and notarized
        if: matrix.name == 'macos' && env.MAC_SIGNED == '1'
        run: |
          dmg="dist/terralauncher-$VERSION-macos-universal.dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app="$mnt/terraLaunch.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E "^(Authority|TeamIdentifier|Runtime)"
          spctl --assess --type execute --verbose "$app"
          hdiutil detach "$mnt"

      # ---- Linux: a tarball laid out like /usr/local (bin/, share/).
      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: cargo build --release --locked -p artcraft-launcher

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          id="xyz.terrapen.terralauncher"
          stage="terralauncher-$VERSION-linux-x86_64"
          mkdir -p "dist/$stage/bin" "dist/$stage/share/applications" "dist/$stage/share/doc/terralauncher"
          install -m 755 target/release/terralauncher "dist/$stage/bin/terralauncher"
          cp "packaging/linux/$id.desktop" "dist/$stage/share/applications/"
          for size in 16 24 32 48 64 128 256 512; do
            dir="dist/$stage/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dir"
            cp "assets/app-icon/hicolor/${size}x${size}/apps/$id.png" "$dir/"
          done
          cp LICENSE-MIT LICENSE-APACHE NOTICE "dist/$stage/share/doc/terralauncher/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          rm -rf "dist/$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: terralauncher-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Only says whether the macOS build was signed: the build fails when some Apple secrets
          # are set and others not, so one of them being set means all were.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$APPLE_TEAM_ID" ]; then
            mac_note="open the disk image and drag terraLaunch to Applications. It is signed with terraPen's Developer ID and notarized by Apple."
          else
            mac_note="open the disk image and drag terraLaunch to Applications. It is not notarized: the first time, open it, then choose Open Anyway in System Settings › Privacy & Security."
          fi
          cd dist
          sha256sum terralauncher-* > SHA256SUMS.txt
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            echo "## Downloads"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Windows 10/11 (64-bit) | [terralauncher-$version-windows-x64.msi]($base/terralauncher-$version-windows-x64.msi) |"
            echo "| macOS 11+ (Apple silicon and Intel) | [terralauncher-$version-macos-universal.dmg]($base/terralauncher-$version-macos-universal.dmg) |"
            echo "| Linux (x86_64) | [terralauncher-$version-linux-x86_64.tar.gz]($base/terralauncher-$version-linux-x86_64.tar.gz) |"
            echo
            echo "Checksums: [SHA256SUMS.txt]($base/SHA256SUMS.txt)"
            echo
            echo "- **Windows:** run the \`.msi\`. It installs for you only (no administrator rights) and adds Start menu and desktop shortcuts. Windows may warn that it is from an unknown publisher; it is not code-signed."
            echo "- **macOS:** $mac_note"
            echo "- **Linux:** \`tar -xzf terralauncher-$version-linux-x86_64.tar.gz --strip-components 1 -C ~/.local\`, then run \`terralauncher\`."
          } > ../notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" terralauncher-* SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file ../notes.md
          else
            gh release create "$GITHUB_REF_NAME" terralauncher-* SHA256SUMS.txt --title "terraLaunch $version" --notes-file ../notes.md --verify-tag
          fi
