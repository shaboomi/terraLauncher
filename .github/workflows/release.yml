name: Release

# Builds terraLauncher for Windows, macOS and Linux. A pushed tag `v<version>` (matching the
# version in Cargo.toml) also publishes a GitHub Release with the files and their checksums.
# Run it by hand (workflow_dispatch) to get the builds as workflow artifacts without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-14
          - name: linux
            os: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      # ---- Windows: a portable zip (unzip and run; settings stay in the folder).
      - name: Build (Windows)
        if: matrix.name == 'windows'
        env:
          TERRALAUNCHER_REQUIRE_WINRES: "1"
        run: cargo build --release --locked -p artcraft-launcher

      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: |
          stage="terraLauncher"
          mkdir -p "dist/$stage"
          cp target/release/terralauncher.exe "dist/$stage/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "dist/$stage/"
          # Beside the exe, this file keeps the launcher's settings and downloads in the folder.
          echo "terraLauncher keeps its data in the terraLauncherData folder beside this file." > "dist/$stage/portable.txt"
          (cd dist && 7z a -tzip "terralauncher-$VERSION-windows-x64-portable.zip" "$stage" > /dev/null)
          rm -rf "dist/$stage"

      # ---- macOS: a universal app in a disk image. Not signed with a Developer ID or notarized.
      - name: Build (macOS)
        if: matrix.name == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p artcraft-launcher --target aarch64-apple-darwin
          cargo build --release --locked -p artcraft-launcher --target x86_64-apple-darwin

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          app="dist/dmg/terraLauncher.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/terraLauncher" \
            target/aarch64-apple-darwin/release/terralauncher target/x86_64-apple-darwin/release/terralauncher
          sed "s/__VERSION__/$VERSION/g" packaging/macos/terralauncher-Info.plist > "$app/Contents/Info.plist"
          # The icon, from the PNG renders.
          icons="assets/app-icon/hicolor"; id="xyz.terrapen.terralauncher"; set="$RUNNER_TEMP/terralauncher.iconset"
          mkdir -p "$set"
          cp "$icons/16x16/apps/$id.png" "$set/icon_16x16.png"
          cp "$icons/32x32/apps/$id.png" "$set/icon_16x16@2x.png"
          cp "$icons/32x32/apps/$id.png" "$set/icon_32x32.png"
          cp "$icons/64x64/apps/$id.png" "$set/icon_32x32@2x.png"
          cp "$icons/128x128/apps/$id.png" "$set/icon_128x128.png"
          cp "$icons/256x256/apps/$id.png" "$set/icon_128x128@2x.png"
          cp "$icons/256x256/apps/$id.png" "$set/icon_256x256.png"
          cp "$icons/512x512/apps/$id.png" "$set/icon_256x256@2x.png"
          cp "$icons/512x512/apps/$id.png" "$set/icon_512x512.png"
          cp assets/app-icon/terralauncher-1024.png "$set/icon_512x512@2x.png"
          iconutil -c icns "$set" -o "$app/Contents/Resources/terralauncher.icns"
          # An ad-hoc signature: Apple silicon runs nothing unsigned. It is not a Developer ID.
          codesign --force --deep --sign - "$app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "terraLauncher" -srcfolder dist/dmg -ov -format UDZO "dist/terralauncher-$VERSION-macos-universal.dmg"
          rm -rf dist/dmg

      # ---- Linux: a tarball laid out like /usr/local (bin/, share/).
      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: cargo build --release --locked -p artcraft-launcher

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          id="xyz.terrapen.terralauncher"
          stage="terralauncher-$VERSION-linux-x86_64"
          mkdir -p "dist/$stage/bin" "dist/$stage/share/applications" "dist/$stage/share/doc/terralauncher"
          install -m 755 target/release/terralauncher "dist/$stage/bin/terralauncher"
          cp "packaging/linux/$id.desktop" "dist/$stage/share/applications/"
          for size in 16 24 32 48 64 128 256 512; do
            dir="dist/$stage/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dir"
            cp "assets/app-icon/hicolor/${size}x${size}/apps/$id.png" "$dir/"
          done
          cp LICENSE-MIT LICENSE-APACHE NOTICE "dist/$stage/share/doc/terralauncher/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          rm -rf "dist/$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: terralauncher-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum terralauncher-* > SHA256SUMS.txt
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            echo "## Downloads"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Windows 10/11 (64-bit) | [terralauncher-$version-windows-x64-portable.zip]($base/terralauncher-$version-windows-x64-portable.zip) |"
            echo "| macOS 11+ (Apple silicon and Intel) | [terralauncher-$version-macos-universal.dmg]($base/terralauncher-$version-macos-universal.dmg) |"
            echo "| Linux (x86_64) | [terralauncher-$version-linux-x86_64.tar.gz]($base/terralauncher-$version-linux-x86_64.tar.gz) |"
            echo
            echo "Checksums: [SHA256SUMS.txt]($base/SHA256SUMS.txt)"
            echo
            echo "- **Windows:** unzip and run \`terralauncher.exe\`. Windows may warn that the app is from an unknown publisher; it is not code-signed."
            echo "- **macOS:** open the disk image and drag terraLauncher to Applications. It is not notarized, so the first time, right-click the app and choose Open."
            echo "- **Linux:** \`tar -xzf terralauncher-$version-linux-x86_64.tar.gz --strip-components 1 -C ~/.local\`, then run \`terralauncher\`."
          } > ../notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" terralauncher-* SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file ../notes.md
          else
            gh release create "$GITHUB_REF_NAME" terralauncher-* SHA256SUMS.txt --title "terraLauncher $version" --notes-file ../notes.md --verify-tag
          fi
