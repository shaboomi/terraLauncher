# terraLauncher catalog: the apps the launcher installs, updates and opens.
# crates/core/build.rs turns this into `catalog::SUITE`. Link-only entries (web apps and
# products) live in crates/core/src/catalog.rs (`WEB_APPS`, `PRODUCTS`).
#
# msi_publisher / name / former_names must match the `Publisher` and `DisplayName` the app's
# Windows installer registers; `bundle` is its macOS bundle id. `setup_args` are passed to the
# Windows setup program so an install or update runs without a wizard. `prereleases = true`
# offers the newest release even when it is marked as a pre-release. `mac_team` is the Apple
# Developer team that signs the macOS build; without one the launcher opens a copy that is
# already there but installs nothing on macOS.

[[apps]]
id = "terragen"
name = "terraGen"
former_ids = []
former_names = ["TerraGen"]
former_bundles = []
mac_bundle_name = "TerraGen"
bundle = "app.terragen.desktop"
tagline = "Generative plotter art"
# terraGen's accent (`--tg-accent`): light theme, dark theme.
color = [224, 53, 79]
ink_light = [179, 18, 44]
ink_dark = [240, 84, 108]
kind = "official"
publisher = "shaboomi"
msi_publisher = "TerraGen"
repo = "shaboomi/terraGen"
setup_args = ["/P"]
prereleases = true
[apps.details]
headline = "A studio for pen-plotter art."
about = "terraGen turns a photo, or nothing at all, into pen lines, simulates the ink, and writes the G-code for your plotter.\n\nNothing leaves this computer unless you ask it to."
platforms = "Windows, macOS, Linux"
[[apps.details.features]]
title = "Photo or blank page"
text = "Start from a photo, or generate lines from nothing at all."
[[apps.details.features]]
title = "Ink simulation"
text = "See how the pens will lay down ink before anything is plotted."
[[apps.details.features]]
title = "G-code out"
text = "Writes the G-code your plotter runs."
[[apps.details.features]]
title = "Local by default"
text = "Everything runs on this computer."

[[apps]]
id = "terraforge"
name = "terraForge"
former_ids = []
former_names = []
former_bundles = []
bundle = "com.terraforge.app"
tagline = "Plotter control and G-code generator"
# terraForge's accent (`--tf-accent`): light theme, dark theme.
color = [233, 69, 96]
ink_light = [184, 45, 69]
ink_dark = [233, 69, 96]
kind = "official"
publisher = "terraPen"
msi_publisher = "terraForge"
repo = "theworkisthework/terraForge"
setup_args = ["/S"]
prereleases = false
[apps.details]
headline = "Plotter control and G-code, in one window."
about = "terraForge is a FluidNC pen-plotter interface: turn SVG artwork into G-code, manage jobs and control the machine."
platforms = "Windows, macOS, Linux"
[[apps.details.features]]
title = "SVG to G-code"
text = "Import SVG artwork and generate the G-code to plot it."
[[apps.details.features]]
title = "Job management"
text = "Queue, send and keep track of plot jobs."
[[apps.details.features]]
title = "Machine control"
text = "Jog, home and run a FluidNC plotter directly."
